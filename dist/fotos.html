<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Fotos — CEI Lindolpho José da Silva</title>
<style>
:root{--ink:#1F2A33;--mut:#55626E;--teal:#0F766E;--bg:#F7F5EF;--line:#D9D4C7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;object-fit:contain}
header b{display:block;font-size:15px}header span{font-size:13px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.aviso{background:#E3F1EE;border:1px solid #B7D9D3;border-radius:10px;padding:12px 14px;font-size:15px}
.erro{background:#FDECEA;border:1px solid #F0B9B3;color:#8A1F14;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.foto{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.foto img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#e9e6dc;display:block}
.foto .nm{padding:8px 10px 0;font-weight:600}
.foto .bt{padding:10px;display:flex;flex-direction:column;gap:8px}
button,.btn{font:inherit;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid #BDB8AA;background:#fff;color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.out{border:2px solid var(--teal);color:var(--teal)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #F5A524;outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=tel]{width:100%;min-height:46px;border:1px solid #BDB8AA;border-radius:8px;padding:0 12px;font:inherit}
.it{border-top:1px solid #ECE8DC;padding:12px 0}.it:first-of-type{border-top:0}
.tam{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tam button{min-height:44px;padding:0 12px}
.qt{display:flex;align-items:center;gap:8px}.qt button{width:46px;padding:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tot{font-size:20px;font-weight:700;border-top:2px solid var(--ink);padding-top:10px;margin-top:8px}
.mut{color:var(--mut);font-size:14px}
.pix{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.pix canvas{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.copia{width:100%;min-height:70px;font:13px ui-monospace,Menlo,monospace;border:1px solid #BDB8AA;border-radius:8px;padding:8px;resize:none;background:#faf9f5}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(min-width:900px){.dois{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}.dois aside{position:sticky;top:12px}}
</style>
</head>
<body>
<header><img src="/logo-lindolpho.png" alt=""><div><b>CEI Lindolpho José da Silva</b><span>Araquari · Fotos das crianças</span></div></header>
<main id="app"><p>Carregando…</p></main>
<script src="/qr.js?v=3736799dce"></script>
<script src="/fotos.js?v=fc11c3ffe0"></script>
</body>
</html>
